<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？｜隨機抽籤器</title>
<style>
:root{color-scheme:light;--ink:#202723;--muted:#727b75;--accent:#247a59;--bg:#f4f6f3;--line:#dce3dd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,540px);background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,6vw,42px);box-shadow:0 14px 45px #1c3c2a0b}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}h1{font-size:clamp(29px,6vw,38px);letter-spacing:-.04em;margin:10px 0 8px}p{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 24px}label{font-size:14px;font-weight:700;display:block;margin-bottom:10px}textarea{width:100%;height:164px;padding:16px;border:1px solid var(--line);border-radius:12px;resize:vertical;font:16px/1.8 inherit;color:var(--ink);outline:none;background:#fcfdfc}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #247a5917}button{margin-top:16px;width:100%;border:0;background:var(--accent);color:white;border-radius:12px;padding:15px;font:700 16px inherit;cursor:pointer;transition:background .15s,transform .15s}button:hover{background:#176145}button:active{transform:scale(.99)}.result{margin-top:24px;background:#f4f8f5;border:1px solid #e1eae3;border-radius:14px;padding:24px 18px;text-align:center;min-height:126px;display:flex;flex-direction:column;justify-content:center;gap:10px}.result small{color:var(--muted);font-size:12px;letter-spacing:.1em}.result strong{font-size:clamp(22px,5vw,30px);overflow-wrap:anywhere}.result.empty strong{font-size:16px;font-weight:500;color:var(--muted)}.steps{border-top:1px solid var(--line);margin-top:26px;padding-top:20px}.steps h2{font-size:14px;margin:0 0 12px}.steps ol{padding-left:20px;margin:0;color:var(--muted);font-size:13px;line-height:2}
</style>
</head>
<body>
<main>
<div class="eyebrow">FOOD PICKER / 01</div>
<h1>今天吃什麼？</h1>
<p>選擇困難的時候，就交給一點點運氣吧。</p>
<label for="choices">候選清單 <span style="color:#89928b;font-weight:400">（每行一個選項）</span></label>
<textarea id="choices" spellcheck="false">便當
麵
咖哩
水餃</textarea>
<button id="pick" type="button">幫我選 ↗</button>
<section class="result empty" aria-live="polite" aria-atomic="true"><small>抽籤結果</small><strong id="answer">按下按鈕，看看今天吃什麼！</strong></section>
<section class="steps"><h2>操作步驟</h2><ol><li>在文字框輸入想吃的食物，每行填寫一個選項。</li><li>點擊「幫我選」，系統會自動去除空白與重複選項。</li><li>在下方查看隨機抽出的結果；可以重複按下重新抽籤。</li></ol></section>
</main>
<script>
const input = document.getElementById('choices');
const answer = document.getElementById('answer');
const result = document.querySelector('.result');
document.getElementById('pick').addEventListener('click', () => {
  const choices = [...new Set(input.value.split(/\r?\n/).map(item => item.trim()).filter(Boolean))];
  if (choices.length === 0) {
    answer.textContent = '請先輸入至少一個選項';
    result.classList.add('empty');
    return;
  }
  const index = Math.floor(Math.random() * choices.length);
  answer.textContent = choices[index];
  result.classList.remove('empty');
});
</script>
</body>
</html>
